[project]
name = "learn-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.0",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.13.3",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.38",
    "status>=0.2.5",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]
